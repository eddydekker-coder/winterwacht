name: probe
on:
  push:
    branches: [obs-probe]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: |
          exec > probe-out.txt 2>&1
          date -u
          echo "=== last rows start 20 oct"; curl -sS -m 40 -X POST -d "start=2026102000&end=2026102324&vars=T:RH&stns=278:279" https://www.daggegevens.knmi.nl/klimatologie/uurgegevens | grep -v '^#' | tail -6
          echo "=== wider: end=2026102524"; curl -sS -m 40 -X POST -d "start=2026102100&end=2026102524&vars=T:RH&stns=278" https://www.daggegevens.knmi.nl/klimatologie/uurgegevens | grep -v '^#' | tail -4
          echo "=== another date format: 20261023 daily-style (YYYYMMDD)"; curl -sS -m 40 -X POST -d "start=20261022&end=20261023&vars=T:RH&stns=278" https://www.daggegevens.knmi.nl/klimatologie/uurgegevens | grep -v '^#' | tail -4
          echo "=== all stations list"; curl -sS -m 40 -X POST -d "start=2026102100&end=2026102101&vars=T&stns=ALL" https://www.daggegevens.knmi.nl/klimatologie/uurgegevens | grep -E '^# +[0-9]{3} ' 
      - name: save
        if: always()
        run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          mkdir -p probe && cp probe-out.txt probe/out.txt
          git add -f probe/out.txt && git commit -qm "probe output" && git push
