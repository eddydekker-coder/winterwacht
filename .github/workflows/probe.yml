name: probe
on:
  push:
    branches: [obs-probe]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: |
          exec > probe-out.txt 2>&1
          date -u
          for ep in RainHistory RainHistoryForecast; do
            curl -sS -m 30 "https://graphdata.buienradar.nl/2.0/forecast/geo/$ep?lat=52.52&lon=6.42" | python3 -c "
          import sys,json
          d=json.load(sys.stdin); f=d['forecasts']
          print('$ep', len(f), f[0]['utcdatetime'], '->', f[-1]['utcdatetime'], [k for k in d if k!='forecasts'])
          print([ (x['utcdatetime'][11:16], x['precipitation']) for x in f][:40])
          "
          done
          for ep in RainHistory24h RainHistory12h Rain24Hours RainHistoryDay Precipitation24Hours Temperature24Hours TemperatureHistory WindHistory; do
            echo -n "$ep: "; curl -sS -m 30 -o b.txt -w "%{http_code} " "https://graphdata.buienradar.nl/2.0/forecast/geo/$ep?lat=52.52&lon=6.42"; head -c 200 b.txt; echo
          done
          echo "=== station graph candidates"
          for u in "https://graphdata.buienradar.nl/2.0/graph/weatherstation/6278" "https://graphdata.buienradar.nl/2.0/forecast/station/6278" "https://observations.buienradar.nl/1.0/actual/weatherstation/history/6278" "https://observations.buienradar.nl/1.0/history/weatherstation/6278" "https://observations.buienradar.nl/1.0/actual/weatherstation/24h/6278" "https://observations.buienradar.nl/1.0/downloadfile/weatherstation/6278"; do
            echo -n "$u: "; curl -sS -m 30 -o b.txt -w "%{http_code} " "$u"; head -c 200 b.txt; echo
          done
      - name: save
        if: always()
        run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          mkdir -p probe && cp probe-out.txt probe/out.txt
          git add -f probe/out.txt && git commit -qm "probe output" && git push
