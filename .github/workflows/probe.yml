name: probe
on:
  push:
    branches: [obs-probe]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: |
          exec > probe-out.txt 2>&1
          date -u
          echo "=== A"; curl -sS -m 40 -X POST -d "start=2026102218&end=2026102324&vars=T:FF:FX:DD:RH:DR&stns=278:279" https://www.daggegevens.knmi.nl/klimatologie/uurgegevens | tail -12
          echo "=== B (start 00)"; curl -sS -m 40 -X POST -d "start=2026102200&end=2026102324&vars=T:RH&stns=278" https://www.daggegevens.knmi.nl/klimatologie/uurgegevens | grep -v '^#' | tail -6
          echo "=== C (extra stations)"; curl -sS -m 40 -X POST -d "start=2026102200&end=2026102324&vars=T:RH&stns=290:273:275" https://www.daggegevens.knmi.nl/klimatologie/uurgegevens | grep -v '^#' | tail -6
          echo "=== D (end next day 24)"; curl -sS -m 40 -X POST -d "start=2026102300&end=2026102324&vars=T:RH&stns=278:279" https://www.daggegevens.knmi.nl/klimatologie/uurgegevens | grep -v '^#' | tail -12
      - name: save
        if: always()
        run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          mkdir -p probe && cp probe-out.txt probe/out.txt
          git add -f probe/out.txt && git commit -qm "probe output" && git push
