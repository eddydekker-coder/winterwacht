name: probe
on:
  push:
    branches: [obs-probe]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: |
          exec > probe-out.txt 2>&1
          date -u
          K=eyJvcmciOiI1ZTU1NGUxOTI3NGE5NjAwMDEyYTNlYjEiLCJpZCI6IjUzYTg1ZDBhMmQ5YzRkYzJiYWNlNzQ4NTQ2Zjk4ODExIiwiaCI6Im11cm11cjEyOCJ9
          B=https://api.dataplatform.knmi.nl/open-data/v1/datasets/10-minute-in-situ-meteorological-observations/versions/1.0/files
          ok=0
          for i in $(seq 1 12); do
            code=$(curl -sS -m 30 -o list.json -w "%{http_code}" -G -H "Authorization: $K" "$B" -d maxKeys=3 -d orderBy=created -d sorting=desc)
            echo "list try $i: $code"; if [ "$code" = "200" ]; then ok=1; break; fi
            sleep $((5 + i*2))
          done
          if [ $ok = 1 ]; then
            cat list.json | head -c 800; echo
            fn=$(python3 -c "import json;print(json.load(open('list.json'))['files'][0]['filename'])")
            for i in 1 2 3 4 5 6; do
              code=$(curl -sS -m 30 -o url.json -w "%{http_code}" -H "Authorization: $K" "$B/$fn/url"); echo "url try $i: $code"
              if [ "$code" = "200" ]; then break; fi; sleep 10
            done
            u=$(python3 -c "import json;print(json.load(open('url.json'))['temporaryDownloadUrl'])")
            curl -sS -m 60 -o obs.nc "$u"; ls -la obs.nc
            pip install -q netCDF4 numpy 2>&1 | tail -1
            python3 - <<'PY'
          import netCDF4, numpy as np
          ds = netCDF4.Dataset('obs.nc')
          print(ds.dimensions.keys())
          for k,v in ds.variables.items():
              print(k, v.dimensions, getattr(v,'long_name',''), getattr(v,'units',''))
          names = ds.variables['stationname'][:] if 'stationname' in ds.variables else None
          print(names[:5] if names is not None else None)
          st = ds.variables['station'][:]
          print(st[:5])
          PY
          fi
      - name: save
        if: always()
        run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          mkdir -p probe && cp probe-out.txt probe/out.txt
          git add -f probe/out.txt && git commit -qm "probe output" && git push
