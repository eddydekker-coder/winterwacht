name: probe
on:
  push:
    branches: [obs-probe]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: |
          exec > probe-out.txt 2>&1
          date -u
          for i in 1 2 3; do
          echo "=== uurgegevens try $i"
          curl -sS -m 40 -X POST -d "start=2026102218&end=2026102324&vars=T:FF:FX:DD:RH:DR&stns=278:279:290:273:275" https://www.daggegevens.knmi.nl/klimatologie/uurgegevens | grep -v '^#' | tail -14
          sleep 20
          done
          echo "=== station list sample"
          curl -sS -m 40 -X POST -d "start=2026102300&end=2026102324&vars=T&stns=ALL" https://www.daggegevens.knmi.nl/klimatologie/uurgegevens | grep -v '^#' | tail -3
          echo "=== previous runs multi model"
          for m in ecmwf_ifs025 ecmwf_aifs025_single ecmwf_aifs025 gfs_seamless gfs025 icon_seamless icon_global gem_seamless knmi_harmonie_arome_europe knmi_seamless meteofrance_seamless ukmo_seamless; do
            echo -n "$m: "; curl -sS -m 30 "https://previous-runs-api.open-meteo.com/v1/forecast?latitude=52.5214&longitude=6.4208&hourly=temperature_2m,temperature_2m_previous_day1,temperature_2m_previous_day3,temperature_2m_previous_day7,wind_speed_10m_previous_day2,precipitation_previous_day5&models=$m&past_days=3&forecast_days=1&timezone=UTC&wind_speed_unit=ms" | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          if d.get('error'): print('ERR',d.get('reason')); sys.exit()
          h=d['hourly']; ks=[k for k in h if k!='time']
          out=[]
          for k in ks:
              v=h[k]; n=sum(1 for x in v if x is not None)
              out.append(k+':'+str(n)+'/'+str(len(v)))
          print(' '.join(out))
          "
          done
      - name: save
        if: always()
        run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          mkdir -p probe && cp probe-out.txt probe/out.txt
          git add -f probe/out.txt && git commit -qm "probe output" && git push
