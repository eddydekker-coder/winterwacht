name: probe
on:
  push:
    branches: [obs-probe]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: |
          exec > probe-out.txt 2>&1
          echo "=== buienradar headers"; curl -sS -m 30 -D - -o br.json https://data.buienradar.nl/2.0/feed/json | head -20
          python3 -c "
          import json
          d=json.load(open('br.json'))
          print([k for k in d['actual']])
          for s in d['actual']['stationmeasurements']:
              if s['stationname'].endswith(('Heino','Hoogeveen')): print(json.dumps(s,indent=1))
          print(len(d['actual']['stationmeasurements']),'stations')
          print(sorted(s['stationname'] for s in d['actual']['stationmeasurements']))
          "
          echo "=== daggegevens uurgegevens"
          curl -sS -m 40 -D - -X POST -d "start=2026102000&end=2026102324&vars=T:FF:FX:DD:RH:DR:P&stns=278:279" https://www.daggegevens.knmi.nl/klimatologie/uurgegevens | head -c 4500
          echo "=== daggegevens daily CORS check"; curl -sS -m 20 -I -H "Origin: https://eddydekker-coder.github.io" https://www.daggegevens.knmi.nl/klimatologie/uurgegevens | head -15
          echo "=== raw github cors"; curl -sS -m 20 -I -H "Origin: https://eddydekker-coder.github.io" https://raw.githubusercontent.com/eddydekker-coder/winterwacht/main/config.json | head -12
          echo "=== opendata list again (rate limit?)"; curl -sS -m 30 -w "\nHTTP %{http_code}\n" -G -H "Authorization: eyJvcmciOiI1ZTU1NGUxOTI3NGE5NjAwMDEyYTNlYjEiLCJpZCI6IjUzYTg1ZDBhMmQ5YzRkYzJiYWNlNzQ4NTQ2Zjk4ODExIiwiaCI6Im11cm11cjEyOCJ9" "https://api.dataplatform.knmi.nl/open-data/v1/datasets/10-minute-in-situ-meteorological-observations/versions/1.0/files" -d maxKeys=2 -d orderBy=created -d sorting=desc | head -c 800
      - name: save
        if: always()
        run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          mkdir -p probe && cp probe-out.txt probe/out.txt
          git add -f probe/out.txt && git commit -qm "probe output" && git push
