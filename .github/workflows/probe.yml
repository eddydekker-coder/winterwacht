name: probe
on:
  push:
    branches: [obs-probe]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: |
          exec > probe-out.txt 2>&1
          date -u
          for u in \
            "https://observations.buienradar.nl/1.0/actual/weatherstation/10min/6278" \
            "https://observations.buienradar.nl/1.0/actual/weatherstation/6278" \
            "https://graphdata.buienradar.nl/2.0/forecast/geo/RainHistoryForecast?lat=52.52&lon=6.42" \
            "https://graphdata.buienradar.nl/2.0/forecast/geo/RainHistory?lat=52.52&lon=6.42" \
            "https://gpsgadget.buienradar.nl/data/raintext?lat=52.52&lon=6.42" \
            "https://graphdata.buienradar.nl/3.0/forecast/geo/RainHistoryForecast?lat=52.52&lon=6.42" \
            "https://graphdata.buienradar.nl/2.0/forecast/geo/Temperature12Hours?lat=52.52&lon=6.42" ; do
            echo "=== $u"; curl -sS -m 30 -D - "$u" -o body.txt | grep -iE "^HTTP|access-control-allow-origin|content-type"; head -c 700 body.txt; echo
          done
      - name: save
        if: always()
        run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          mkdir -p probe && cp probe-out.txt probe/out.txt
          git add -f probe/out.txt && git commit -qm "probe output" && git push
