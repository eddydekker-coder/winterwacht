name: Nieuwe modelruns ophalen

on:
  schedule:
    # Elk uur op :23. Het script slaat alleen op als er echt een nieuwe run is.
    - cron: '23 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Runs ophalen en samenvatten
        run: node scripts/update.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Weerkaarten ophalen (AIFS, ECMWF en GFS)
        # Mag falen zonder de rest van de update te blokkeren; de app toont dan de vorige kaartrun.
        # De kaartvelden staan op de aparte tak maps-data (steeds 1 commit), zodat de hoofdtak niet groeit.
        continue-on-error: true
        run: |
          git clone --quiet --depth 1 --branch maps-data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" maps-out || mkdir -p maps-out
          pip install --quiet numpy eccodes ecmwf-opendata
          MAPS_OUT="$PWD/maps-out" python scripts/maps.py
      - name: Kaartvelden publiceren (tak maps-data)
        continue-on-error: true
        run: |
          cd maps-out
          if [ -f .updated ]; then
            rm -f .updated
            rm -rf .git
            git init --quiet -b maps-data
            git config user.name "winterwacht-bot"
            git config user.email "actions@users.noreply.github.com"
            git add -A
            git commit --quiet -m "Kaartvelden $(date -u +'%Y-%m-%d %H:%MZ')"
            git push --quiet --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" maps-data
          else
            echo "Geen nieuwe kaartruns."
          fi
      - name: Waarnemingen ophalen (KNMI, extra aanloop naast obs.yml)
        # GitHub voert schema's van elke 10 minuten vaak met uren vertraging uit; dit uurlijkse schema is betrouwbaarder.
        continue-on-error: true
        env:
          KNMI_API_KEY: ${{ secrets.KNMI_API_KEY }}
        run: |
          git clone --quiet --depth 1 --branch obs-data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" obs-out || mkdir -p obs-out
          pip install --quiet netCDF4
          OBS_OUT="$PWD/obs-out" python scripts/obs.py
          cd obs-out
          if [ -f .updated ]; then
            rm -f .updated
            rm -rf .git
            git init --quiet -b obs-data
            git config user.name "winterwacht-bot"
            git config user.email "actions@users.noreply.github.com"
            git add -A
            git commit --quiet -m "Waarnemingen $(date -u +'%Y-%m-%d %H:%MZ')"
            git push --quiet --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" obs-data
          fi
      - name: Opslaan als er iets nieuws is
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "winterwacht-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data
            git commit -m "Nieuwe modelrun $(date -u +'%Y-%m-%d %H:%MZ')"
            git push
          else
            echo "Geen nieuwe runs."
          fi
